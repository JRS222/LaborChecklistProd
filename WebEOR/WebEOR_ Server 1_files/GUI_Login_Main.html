//** Description: Verfiy that the user name and password input boxes have been

//*********************************************************************************
function ValidateInput() {

	if (document.FormPassword.User.value.length == 0) {
		alert("Please enter User Name!");
		return false;
	}

	if (document.FormPassword.Pword.value.length == 0) {
		alert("Please enter User Password!");
		return false;
	}

	return true;

}

 function SetSiteList()
 {
 	var lOfflineInd;
 	var lChildInd;
 	var lintLoop;
 	var i ;
 	var j ;
	var lintSelected = -1;
	var lstrSelectedText = "";

 	lOfflineInd = document.forms[0].elements["Offline"].checked;
 	lChildInd = document.forms[0].elements["ChildSites"].checked;

	if ( document.forms[0].ParentSiteID.options.selectedIndex > -1 )
	{
		lintSelected = document.forms[0].ParentSiteID.options[ document.forms[0].ParentSiteID.options.selectedIndex ].value;
		lstrSelectedText = document.forms[0].ParentSiteID.options[ document.forms[0].ParentSiteID.options.selectedIndex ].text;
	}

 	for ( lintLoop = document.forms[0].ParentSiteID.options.length; lintLoop > -1; lintLoop-- )
	{
 		document.forms[0].ParentSiteID.options[ lintLoop ] = null;
	}

    if (lOfflineInd && !lChildInd)
 	{
 		j = 0;
 		for (i = 0; i < garrAllSites.length; i++ )
 		{
 			document.forms[0].ParentSiteID.options[j] =
 				new Option( garrAllSites[i+1], garrAllSites[i]);

			if ( String( garrAllSites[i]) == String( lintSelected ))
				document.forms[0].ParentSiteID.options[j].selected = true;

 			i++;
 			j++;
 		}

 		document.forms[0].elements["Offline"].value = "TRUE";
		document.forms[0].elements["ChildSites"].value = "FALSE";
		document.getElementById("displaychild").innerHTML = "";
 	}
 	else if (lOfflineInd && lChildInd)
 	{
 		j = 0;
 		for (i = 0; i < garrAllSitesWithChild .length; i++ )
 		{
 			document.forms[0].ParentSiteID.options[j] =
 				new Option( garrAllSitesWithChild [i+2], garrAllSitesWithChild [i]);

			if ( String( garrAllSitesWithChild [i]) == String( lintSelected ) && 
				String( garrAllSitesWithChild [i+2]).includes(String( lstrSelectedText )) )
				document.forms[0].ParentSiteID.options[j].selected = true;

 			i=i+2;
 			j++;
 		}

 		document.forms[0].elements["Offline"].value = "TRUE";
 		document.forms[0].elements["ChildSites"].value = "TRUE";
 	}
 	else if (!lOfflineInd && lChildInd)
     {
 		j = 0;
 		for (i = 0; i < garrActiveSitesWithChild .length; i++ )
 		{
 			document.forms[0].ParentSiteID.options[j] =
 				new Option( garrActiveSitesWithChild [i+2], garrActiveSitesWithChild [i]);

			if ( String( garrActiveSitesWithChild [i]) == String( lintSelected ) && 
				String( garrActiveSitesWithChild[i+2]).includes(String( lstrSelectedText )) )
				document.forms[0].ParentSiteID.options[j].selected = true;

 			i=i+2;
 			j++;
 		}

 		document.forms[0].elements["Offline"].value = "FALSE";
 		document.forms[0].elements["ChildSites"].value = "TRUE";
 	}
 	else
	//It Loads the parent sites without offline sites when Offline Sites checkbox is unchecked
	{
 		j = 0;
 		for (i = 0; i < garrActiveSites.length; i++ )
 		{
 			document.forms[0].ParentSiteID.options[j] =
 				new Option( garrActiveSites[i+1], garrActiveSites[i]);

			if ( String( garrActiveSites[i]) == String( lintSelected ))
				document.forms[0].ParentSiteID.options[j].selected = true;

			i++;
 			j++;
 		}
 		document.forms[0].elements["Offline"].value = "FALSE";
		document.forms[0].elements["ChildSites"].value = "FALSE";
		document.getElementById("displaychild").innerHTML = "";
		
 	}
 }
 
  function SetChildSiteList()
 {
 	var lOfflineInd;
 	var lChildInd;
 	var i;
	var lintSelected = -1;
	var lstrSelectedText = "";
	var lstrChildList = "";

 	lOfflineInd = document.forms[0].elements["Offline"].checked;
 	lChildInd = document.forms[0].elements["ChildSites"].checked; 

	if ( document.forms[0].ParentSiteID.options.selectedIndex > -1 )
	{
		lintSelected = document.forms[0].ParentSiteID.options[ document.forms[0].ParentSiteID.options.selectedIndex ].value;
		lstrSelectedText = document.forms[0].ParentSiteID.options[ document.forms[0].ParentSiteID.options.selectedIndex ].text;
	}
    if (lChildInd)
 	{
 	    lstrChildList = "<ul>";
 	    if (lOfflineInd)
 	    {
 		    for (i = 0; i < garrAllSitesWithChild.length; i++ )
 		    {

			    if ( String( garrAllSitesWithChild[i]) == String( lintSelected ) && String( garrAllSitesWithChild[i+2] ) != String( lstrSelectedText ))
			        lstrChildList = lstrChildList +  "<li>" + String( garrAllSitesWithChild[i+2]) + "</li>";
    					
 			    i=i+2;
 		    }
 		    lstrChildList =  lstrChildList +  "</ul>";
     	
 		    document.forms[0].elements["Offline"].value = "TRUE";
 		    document.getElementById("displaychild").innerHTML = lstrChildList;
 	    }
 	    else
	    {
 		    for (i = 0; i < garrActiveSitesWithChild.length; i++ )
 		    {
			    if ( String( garrActiveSitesWithChild[i]) == String( lintSelected ) && String( garrActiveSitesWithChild[i+2]) != String( lstrSelectedText ))
				    lstrChildList = lstrChildList +  "<li>" + String( garrActiveSitesWithChild[i+2]) + "</li>";
    				
 			    i=i+2;
 		    }
 		    lstrChildList = lstrChildList +  "</ul>";
     		
 		    document.forms[0].elements["Offline"].value = "FALSE";
 		    document.getElementById("displaychild").innerHTML = lstrChildList;
 	    }
     }
 }
