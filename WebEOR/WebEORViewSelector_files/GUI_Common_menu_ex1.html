/*****************************************************************************
Place the mouseover image onto the specified image
******************************************************************************/
function mOverBttn( rstrName )
{
	if (document.images ) 
	{
		document[ rstrName ].src = eval( "over_" + rstrName + ".src" );
	}
}


/*****************************************************************************
Place the normal image onto the specified image
******************************************************************************/
function mOutBttn( rstrName )
{
	if (document.images ) 
	{
		document[ rstrName ].src = eval( "norm_" + rstrName + ".src" );
	}
}


/*****************************************************************************
Default browsercheck
******************************************************************************/
function checkBrowser(){


	this.ver=navigator.appVersion
	this.dom=document.getElementById?1:0
	this.ie5=((this.ver.indexOf("MSIE 5")>-1 || this.ver.indexOf("MSIE 6")>-1 || this.ver.indexOf("MSIE 7")>-1) && this.dom)?1:0;
	this.ie4=(document.all && !this.dom)?1:0;
	this.ns5=(this.dom && parseInt(this.ver) >= 5) ?1:0;
	this.ns4=(document.layers && !this.dom)?1:0;
	this.opera=!(this.ie5 || this.ie4 || this.ns4 || this.ns5) && this.dom;
	this.bw=(this.ie5 || this.ie4 || this.ns4 || this.ns5);
	return this;


}

var bw = new checkBrowser();

var gintEraseM = 1;	// Flag to tell if mouse is over the Menu option 'Menu'
var gintEraseD = 1;	// Flag to tell if mouse is over the dropdown
// NOTE: Only when both flags are set will the checkEraseMenu() function
//	erase the dropdown menu.



/*****************************************************************************
** FUNCTION NAME: getScrolled
**
** DESCRIPTION: This function returns an object with the current scrolled
**	offsets of the 'frmMain' frame.
**
** PARAMETERS:
**	None
**
******************************************************************************/
function getScrolled(){

 
	if(bw.dom || bw.ie4){
		this.scrolledX = parent.frmMain.document.body.scrollLeft;
		this.scrolledY = parent.frmMain.document.body.scrollTop;
		this.pageWidth = parent.frmMenu.document.body.clientWidth;
	} else {
		this.scrolledX = parent.frmMain.pageXOffset;
		this.scrolledY = parent.frmMain.pageYOffset;
	}

	return this;
}



function getIPTSFrameScrolled(){

	if(bw.dom || bw.ie4){
		this.scrolledX = parent.frmMain.frmWorkloadDetail.document.body.scrollLeft;
		this.scrolledY = parent.frmMain.frmWorkloadDetail.document.body.scrollTop;
		this.pageWidth = parent.frmMain.frmWorkloadDetail.document.body.clientWidth;
	} else {
		this.scrolledX = parent.frmMain.frmWorkloadDetail.pageXOffset;
		this.scrolledY = parent.frmMain.frmWorkloadDetail.pageYOffset;
	}

	return this;
}



/*****************************************************************************
** FUNCTION NAME: getDataMenuStyle
**
** DESCRIPTION: This function returns an object that references the style
**	of the menu dropdwon in the 'frmMain' frame.
**
** PARAMETERS:
**	None
**
******************************************************************************/
function getDataMenuStyle()
{
	if ( bw.dom || bw.ie4 )
		this.style = parent.frmMain.document.all["DataMenu"].style;
	else if ( bw.ns4 )
		this.style = parent.frmMain.document.DataMenu;

	return this;
}



function getIPTSFrameDataMenuStyle()
{
	if ( bw.dom || bw.ie4 )
		this.style = parent.frmMain.frmWorkloadDetail.document.all["DataMenu"].style;
	else if ( bw.ns4 )
		this.style = parent.frmMain.frmWorkloadDetail.document.DataMenu;

	return this;
}



/*****************************************************************************
** FUNCTION NAME: checkForMainBodyPage
**
** DESCRIPTION: Checks the 'frmMain' frame to see if the proper objects are
**	on the page. This function is normally called before some action is
**	taken on the 'frmMain' frame.
**
** PARAMETERS:
**	None
**
******************************************************************************/
function checkForMainBodyPage()
{
	if ( !(parent.frmMain ))
		return false; 

	if ( bw.dom || bw.ie4 )

		return parent.frmMain.document.all["DataMenu"]? true: false;


	else if ( bw.ns4 )
 
		return parent.frmMain.document.DataMenu? true: false;

	return false;
}



function checkForIPTSFrameMainBodyPage()
{
	if ( !(parent.frmMain ))
		return false;

	if ( !(parent.frmMain.frmWorkloadDetail ))
		return false;

	if ( bw.dom || bw.ie4 )
		return parent.frmMain.frmWorkloadDetail.document.all["DataMenu"]? true: false;
	else if ( bw.ns4 )
		return parent.frmMain.document.frmWorkloadDetail.document.DataMenu? true: false;

	return false;
}



/*****************************************************************************
** FUNCTION NAME: makeMenuAppear
**
** DESCRIPTION: Causes the hidden menu in the 'frmMain' frame to appear.
**
** PARAMETERS:
**	None
**
******************************************************************************/
function makeMenuAppear()
{
	mOverBttn( "menu_img");

	if ( checkForMainBodyPage())
	{
		var lobjMenu = new getDataMenuStyle();
		var lobjScrolled = new getScrolled();

		gintEraseM = 0;
		lobjMenu.style.top = lobjScrolled.scrolledY;
		lobjMenu.style.left = lobjScrolled.scrolledX + lobjScrolled.pageWidth - 150;
		lobjMenu.style.visibility = "visible";
		parent.frmMain.SendMessage( "Menu: Appear Called" );
	} 
	else if ( checkForIPTSFrameMainBodyPage())
	{
		var lobjMenu = new getIPTSFrameDataMenuStyle();
		var lobjScrolled = new getIPTSFrameScrolled();

		gintEraseM = 0;
		lobjMenu.style.top = lobjScrolled.scrolledY;
		lobjMenu.style.left = lobjScrolled.scrolledX + lobjScrolled.pageWidth - 133;
		lobjMenu.style.visibility = "visible";
		parent.frmMain.frmWorkloadDetail.SendMessage( "Menu: Appear Called" );
	}
}



/*****************************************************************************
** FUNCTION NAME: checkEraseMenu
**
** DESCRIPTION: Causes the dropdown menu to disappear. It first checks to be sure 
**	that the mouse pointer has not moved over the dropdown menu.
**
** PARAMETERS:
**	None
**
******************************************************************************/
function checkEraseMenu()
{
	if ( gintEraseM == 1 && gintEraseD == 1)
	{
		mOutBttn( "menu_img" );

		if ( checkForMainBodyPage())
		{
			var lobjMenu = new getDataMenuStyle();

			parent.frmMain.SendMessage( "Menu: Erase Menu Called" );
			lobjMenu.style.visibility = "hidden";
			lobjMenu.style.left = 0;
		} 
		else if ( checkForIPTSFrameMainBodyPage())
		{
			var lobjMenu = new getIPTSFrameDataMenuStyle();

			parent.frmMain.frmWorkloadDetail.SendMessage( "Menu: Erase Menu Called" );
			lobjMenu.style.visibility = "hidden";
			lobjMenu.style.left = 0;
		} 
	}
}


/*****************************************************************************
** FUNCTION NAME: makeMenuDisappear
**
** DESCRIPTION: Causes the dropdown menu to disappear by calling the 
**	checkErase function. This function uses a timeout to ensure that the 
**	mouse pointer has not moved over the dropdown menu.
**
** PARAMETERS:
**	None
**
******************************************************************************/
function makeMenuDisappear()
{


	gintEraseM = 1;
	setTimeout( "checkEraseMenu();", 2000 );

	if ( checkForMainBodyPage())
		parent.frmMain.SendMessage( "Menu: Disappear Called" );
}   


//********************************************************************************
//** FUNCTION: Logout
//**
//** DESCRIPTION: Prompt the user to log out, then if yes, log them out and
//**	returns them to the login screen.
//**
//** PARAMETERS:
//**	None
//**
//** RETURN VALUES:

function Logout()
{
	if ( confirm("Are you sure you want to log out?") )
		parent.frmMain.document.location.href = "../GUI_Login_Main.asp";
}

function loadCurrentHelp()
{
	
	//to get the right help content if Help is already opened
	if (!newWindow.closed && newWindow.location) {
		newWindow.close();
	}
	 
	newWindow=parent.open(parent.frames["frmMain"].document.forms[0].elements["Help_Loc"].value, "HelpEOR");
	newWindow.focus();
}
